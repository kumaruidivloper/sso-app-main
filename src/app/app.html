
<div style="margin: 0 auto; width: 80%; padding: 10px 10px;">
<div style="text-align: center;">     
  <button matButton="tonal" (click)="sharedService.sendMessageToApp2('message')" style="margin-right: 20px;">Send Message to App2</button>
  <mat-form-field appearance="outline" style="width: 250px;">
  <mat-label>Please Select the Form</mat-label>
  <mat-select [(ngModel)]="selectedForm" (selectionChange)="onChange($event)" name="forms" id="forms">
    <mat-option value="please select the form">please select the form</mat-option>
    <mat-option value="first">First Form</mat-option>
    <mat-option value="second">Second Form</mat-option>
    <mat-option value="third">Third Form</mat-option>
  </mat-select>
  </mat-form-field>

<div style="border: solid 1px #000; text-align: center; margin-top: 10px; padding: 10px; background-color: rgb(196, 255, 218); margin-bottom: 20px;">
  <button (click)="incrementApp2('pluse')">+</button>
  <h1>Counter: {{counter() }}</h1>
  <button (click)="decrementApp2('minus')">-</button>
</div>

<div style="text-align: center; width: 50%; padding: 10px; border: solid 1px #000; margin: 0 auto; border-radius:20px;">
  <h3>
      <pre>{{message() | json}}</pre>
