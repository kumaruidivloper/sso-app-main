
<div style="margin: 0 auto; width: 80%; padding: 10px 10px;">
<div style="text-align: center;">     
  <button matButton="tonal" (click)="selectedOption === '1' ? sharedService.onIframeLoad('message', false)  :sharedService.sendMessageToApp2('message')" style="margin-right: 20px;">Send Message to App2</button>
  <mat-form-field appearance="outline" style="width: 250px;">
  <mat-label>Please Select the Form</mat-label>
  <mat-select [(ngModel)]="selectedForm" (selectionChange)="onChange($event)" name="forms" id="forms">
    <mat-option value="please select the form">please select the form</mat-option>
    <mat-option value="first">First Form</mat-option>
    <mat-option value="second">Second Form</mat-option>
    <mat-option value="third">Third Form</mat-option>
  </mat-select>
  </mat-form-field>
<div>
<mat-radio-group [(ngModel)]="selectedOption" aria-label="Select an option">
  <mat-radio-button value="1">Communicate Via Ifram</mat-radio-button>
  <mat-radio-button value="2">Communicate Via Tab</mat-radio-button>
</mat-radio-group>
</div>
<div>

</div>

<mat-card appearance="outlined" class="card-style">
<!-- <div style="border: solid 1px #000; text-align: center; margin-top: 10px; padding: 20px 10px; background-color: bisque; margin-bottom: 20px;"> -->
  <button matMiniFab (click)="decrementApp2('minus')"><mat-icon>remove</mat-icon></button>
  <h1>Counter: {{counter() }}</h1>
  <button matMiniFab (click)="incrementApp2('pluse')"><mat-icon>add</mat-icon></button>
<!-- </div> -->
</mat-card>

<div style="text-align: center; width: 50%; padding: 10px; border: solid 1px #000; margin: 0 auto; border-radius:20px;">
  <h3>
      <pre>{{message() | json}}</pre>
  </h3>
</div>
</div>

@if(selectedOption === '1') {
  <div style="width: 80%; margin: 10px auto; border: solid 4px #b07011; background-color: #b07011; border-radius: 10px; color: #fff;">
  <h3 style="text-align: center;">SUB APP INSIDE THE IFRAME</h3>
  <iframe 
    #myIframe 
    id="app2-iframe"
    src="http://localhost:4201" 
    width="100%"
    style="border: none; min-height: 500px;">
  </iframe>
</div>
}
