
<div style="margin: 0 auto; width: 80%;">
<div style="text-align: center;">
  <button (click)="sharedService.sendMessageToApp2('message')" style="padding: 8px; margin-right: 10px;">Send Message to App2</button>
  <select [(ngModel)]="selectedForm" (change)="onChange($event)" name="forms" id="forms" style="padding: 8px;">
  <option value="please select the form">please select the form</option>
  <option value="first">First Form</option>
  <option value="second">Second Form</option>
  <option value="third">Third Form</option>
</select>
</div>

<div style="border: solid 1px #000; text-align: center; margin-top: 10px; padding: 10px; background-color: rgb(196, 255, 218); margin-bottom: 20px;">
  <button (click)="incrementApp2('pluse')">+</button>
  <h1>Counter: {{counter() }}</h1>
  <button (click)="decrementApp2('minus')">-</button>
</div>

<div style="text-align: center; width: 50%; padding: 10px; border: solid 1px #000; margin: 0 auto; border-radius:20px;">
  <h3>
      <pre>{{message() | json}}</pre>
  </h3>
</div>
</div>
